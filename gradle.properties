org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft 26.2 ships unobfuscated, so no mappings provider is available or
# needed. Loom detects this automatically (release date >= 2025-11-01 with no
# client_mappings in the version manifest) and switches the production
# namespace to "official". It still requires a mappings dependency, so an
# empty identity mapping is supplied via identity.tiny.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.19

# Mod properties
mod_version=2.0.0
maven_group=com.example
archives_base_name=autohome

# Dependencies
fabric_version=0.157.0+26.2
cloth_config_version=26.2.155
modmenu_version=20.0.1
